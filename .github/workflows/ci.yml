name: DocuIntel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docuintel_test
          POSTGRES_USER: docuintel
          POSTGRES_PASSWORD: change_me
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U docuintel -d docuintel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    env:
      DATABASE_URL: postgresql+psycopg://docuintel:change_me@127.0.0.1:55432/docuintel_test
      TEST_DATABASE_URL: postgresql+psycopg://docuintel:change_me@127.0.0.1:55432/docuintel_test
      APP_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Compile Python sources
        run: python -m compileall -q app streamlit_app scripts tests

      - name: Run tests with coverage
        run: >-
          python -m pytest -rs
          --cov=app
          --cov=streamlit_app
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html:htmlcov

      - name: Check dependency consistency
        run: python -m pip check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docuintel-coverage
          path: |
            coverage.xml
            htmlcov
