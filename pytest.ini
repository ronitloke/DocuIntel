[pytest]
pythonpath = .
testpaths = tests
addopts = --basetemp=.pytest_tmp
cache_dir = .pytest_cache

markers =
    integration: tests requiring an isolated PostgreSQL/pgvector database
    module4: Module 4 chunking and embedding verification
    module5: Module 5 search verification
    module6: Module 6 cross-encoder reranking verification
    module7: Module 7 grounded RAG verification
    module8: Module 8 conversation sessions and multi-turn RAG verification
    module9: Module 9 retrieval and grounded-answer evaluation verification
    performance: deterministic local performance measurements; no external services required
    real_ollama: opt-in tests requiring the externally managed Ollama service
